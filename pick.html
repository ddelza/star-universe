<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 주제 고르기</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="pres.css?v=9">
</head>
<body>
<div class="wrap">
  <div class="header"><h1>📌 발표 주제 고르기</h1><p id="who"></p></div>
  <div id="nav" class="nav"></div>

  <div class="notice">
    💡 같은 반 친구와 주제가 <b>겹쳐도 일단 선택할 수 있어요.</b> 겹친 경우에는 <b>월요일에 가위바위보</b>로 정해서 다시 배정해요.<br>
    마음에 드는 주제가 없다면 <b>✏️ 직접 작성</b>에서 나만의 주제를 만들 수 있어요.
  </div>

  <div id="mine"></div>

  <div class="tabs" id="tabs"></div>

  <div id="listArea">
    <input type="text" id="q" class="searchbox" placeholder="🔍 키워드나 주제로 검색 (예: 블랙홀, AI)">
    <div class="count-line" id="countLine"></div>
    <div class="small-note" style="margin:-4px 2px 10px"><span class="taken-ribbon" style="font-size:.66rem">🙋 선택됨</span> 표시가 있는 주제는 같은 반 친구가 이미 고른 주제예요.</div>
    <div id="list"><div class="loading-state">불러오는 중...</div></div>
  </div>

  <div id="customArea" style="display:none">
    <div class="card">
      <h2>✏️ 내가 직접 정한 주제</h2>
      <p class="hint">「별과 우주」에서 배운 내용이나 관심 있는 내용, 또는 「과학기술과 인류문명」에서 소개하고 싶은 기술·발명품이면 돼요.</p>
      <label class="field-label">관련 단원</label>
      <div class="dc-choices" id="cUnit">
        <label class="dc-choice"><input type="radio" name="cu" value="별과 우주"> 별과 우주</label>
        <label class="dc-choice"><input type="radio" name="cu" value="과학기술과 인류문명"> 과학기술과 인류문명</label>
      </div>
      <label class="field-label" for="cKw">키워드 (쉼표로 구분, 1~3개)</label>
      <input type="text" id="cKw" maxlength="40" placeholder="예) 블랙홀, 사건의 지평선">
      <label class="field-label" for="cTopic">주제 (문장으로)</label>
      <textarea id="cTopic" maxlength="150" placeholder="예) 빛조차 빠져나오지 못하는 블랙홀을 우리는 어떻게 관측할까?"></textarea>
      <div class="small-note">주제는 “~이다.” 또는 “~할까?” 처럼 <b>하나의 문장</b>으로 써 보세요.</div>
      <div class="error-msg" id="cErr"></div>
      <button class="btn" id="cBtn" onclick="saveCustom()">이 주제로 등록하기</button>
    </div>
  </div>
</div>
<div id="toastBox"></div>

<script src="topics.js?v=1"></script>
<script src="session.js?v=7"></script>
<script>
const me = requireLogin();
if (me && me.isTeacher) { alert('교사 계정은 주제를 선택하지 않아요. 전체 현황으로 이동합니다.'); location.href = 'board.html'; }

const FILTERS = [['all', '전체'], ['별과 우주', '별과 우주'], ['과학기술과 인류문명', '과학기술과 인류문명'], ['custom', '✏️ 직접 작성']];
let filter = 'all', query = '', picks = {}, base = '';

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastBox').appendChild(el); setTimeout(() => el.remove(), 2600);
}

function sameClass(p) { return p && String(p.grade) === String(me.grade) && String(p.ban) === String(me.ban); }
function classByTopic() {
  const m = {};
  Object.values(picks).forEach(p => { if (p && p.no && sameClass(p)) (m[p.no] = m[p.no] || []).push(p); });
  return m;
}

async function loadPicks() { picks = (await dbGet(base + '/picks')) || {}; }

function renderTabs() {
  document.getElementById('tabs').innerHTML = FILTERS.map(f =>
    `<button class="tab-btn ${filter === f[0] ? 'active' : ''}" onclick="setFilter('${f[0]}')">${f[1]}</button>`).join('');
  document.getElementById('listArea').style.display = filter === 'custom' ? 'none' : 'block';
  document.getElementById('customArea').style.display = filter === 'custom' ? 'block' : 'none';
}
window.setFilter = function (f) { filter = f; renderTabs(); if (f !== 'custom') renderList(); else fillCustom(); };

function renderMine() {
  const p = picks[me.id], box = document.getElementById('mine');
  if (!p) { box.innerHTML = '<div class="card" style="padding:14px 16px"><b style="font-size:.9rem">아직 주제를 고르지 않았어요.</b></div>'; return; }
  const dups = Object.values(picks).filter(o => o && o.id !== me.id && sameClass(o) && p.no && o.no === p.no);
  box.innerHTML = `<div class="card topic-card mine" style="padding:16px">
    <div class="tc-top"><span class="mine-badge" style="margin:0">✅ 내가 고른 주제</span>
      <span class="tag ${p.unit === '별과 우주' ? 'a' : 'b'}">${esc(p.unit)}</span>
      ${p.kind === 'custom' ? '<span class="tag" style="background:#f3e8ff;color:#7b2cbf">직접 작성</span>' : ''}</div>
    <div class="chips">${String(p.kw).split(',').map(k => '<span class="chip">' + esc(k.trim()) + '</span>').join('')}</div>
    <div class="tc-topic">${esc(p.topic)}</div>
    ${dups.length ? `<div class="dup">⚠️ 같은 반 <b>${dups.map(d => esc(d.name)).join(', ')}</b> 학생도 이 주제를 골랐어요. <b>월요일에 가위바위보</b>로 정해요!</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:10px">
      <a class="btn small" style="text-decoration:none;flex:1;text-align:center;padding:10px" href="my.html">📝 대본 쓰러 가기</a>
      <button class="btn small danger-outline" style="padding:10px 14px" onclick="cancelPick()">선택 취소</button>
    </div></div>`;
}

function renderList() {
  const byT = classByTopic(), q = query.trim().toLowerCase();
  const items = TOPICS.filter(t => (filter === 'all' || t.unit === filter) && (!q || (t.kw + ' ' + t.topic).toLowerCase().includes(q)));
  document.getElementById('countLine').textContent = `${items.length}개 주제`;
  document.getElementById('list').innerHTML = items.length ? items.map(t => {
    const mineNow = picks[me.id] && picks[me.id].no === t.no;
    const others = (byT[t.no] || []).filter(p => p.id !== me.id);
    return `<div class="topic-card ${mineNow ? 'mine' : others.length ? 'taken' : ''}">
      <div class="tc-top"><span class="tc-no">#${t.no}</span><span class="tag ${t.unit === '별과 우주' ? 'a' : 'b'}">${esc(t.unit)}</span>${others.length ? '<span class="taken-ribbon">🙋 ' + (others.length > 1 ? others.length + '명' : '1명') + ' 선택됨</span>' : ''}</div>
      <div class="tc-topic">${esc(t.topic)}</div>
      <div class="chips">${t.kw.split(',').map(k => '<span class="chip">' + esc(k.trim()) + '</span>').join('')}</div>
      ${others.length ? `<div class="dup">⚠️ 우리 반 <b>${others.map(o => esc(o.name)).join(', ')}</b> 학생이 이미 선택했어요. 겹치면 월요일에 가위바위보!</div>` : ''}
      ${mineNow ? '<div class="mine-badge">✅ 내가 선택한 주제</div>' : `<button class="pick-btn" onclick="choose(${t.no})">이 주제 선택</button>`}
    </div>`;
  }).join('') : '<div class="empty-state">검색 결과가 없어요.</div>';
}

window.choose = async function (no) {
  const t = TOPICS[no - 1];
  try { await loadPicks(); } catch (e) {}
  const others = (classByTopic()[no] || []).filter(p => p.id !== me.id);
  let msg = `「${t.topic}」\n\n이 주제를 선택할까요?`;
  if (others.length) msg = `우리 반 ${others.map(o => o.name).join(', ')} 학생이 이미 고른 주제예요.\n겹쳐도 선택할 수 있지만 월요일에 가위바위보로 다시 정해요.\n\n그래도 선택할까요?`;
  if (picks[me.id]) msg += '\n\n(지금 고른 주제는 바뀌어요. 써 둔 대본은 그대로 남아요.)';
  if (!confirm(msg)) return;
  await savePick({ kind: 'preset', no: t.no, unit: t.unit, kw: t.kw, topic: t.topic });
};

async function savePick(p) {
  const rec = Object.assign({ id: me.id, grade: me.grade, ban: me.ban, num: me.num, name: me.name, ts: Date.now() }, p);
  try {
    await dbPut(base + '/picks/' + me.id, rec);
    picks[me.id] = rec;
    await loadPicks().catch(() => {});
    renderMine(); renderList();
    toast('✅ 주제가 등록됐어요!');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return true;
  } catch (e) { alert(e.message); return false; }
}

window.cancelPick = async function () {
  if (!confirm('주제 선택을 취소할까요? (써 둔 대본은 남아요)')) return;
  try { await dbDel(base + '/picks/' + me.id); delete picks[me.id]; renderMine(); renderList(); toast('선택을 취소했어요.'); }
  catch (e) { alert(e.message); }
};

function fillCustom() {
  const p = picks[me.id];
  if (p && p.kind === 'custom' && !document.getElementById('cTopic').value) {
    document.getElementById('cKw').value = p.kw; document.getElementById('cTopic').value = p.topic;
    const r = document.querySelector(`input[name=cu][value="${p.unit}"]`); if (r) r.checked = true;
  }
}

window.saveCustom = async function () {
  const unit = (document.querySelector('input[name=cu]:checked') || {}).value;
  const kw = document.getElementById('cKw').value.split(',').map(s => s.trim()).filter(Boolean).join(', ');
  const topic = document.getElementById('cTopic').value.trim().replace(/\s+/g, ' ');
  const err = document.getElementById('cErr');
  const fail = m => { err.textContent = m; err.classList.add('show'); };
  err.classList.remove('show');
  if (!unit) return fail('관련 단원을 선택해 주세요.');
  if (!kw) return fail('키워드를 입력해 주세요.');
  if (topic.length < 10) return fail('주제를 문장으로 조금 더 자세히 써 주세요. (10자 이상)');
  if (picks[me.id] && !confirm('지금 고른 주제가 이 주제로 바뀌어요. 계속할까요?')) return;
  const btn = document.getElementById('cBtn'); btn.disabled = true;
  const ok = await savePick({ kind: 'custom', no: null, unit, kw, topic });
  btn.disabled = false;
  if (ok) { filter = 'all'; renderTabs(); renderList(); }
};

document.getElementById('q').addEventListener('input', e => { query = e.target.value; renderList(); });

(async function init() {
  document.getElementById('who').textContent = whoLabel(me);
  renderNav('pick'); renderTabs();
  try { base = await basePath(); await loadPicks(); } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty-state">불러오지 못했어요. 새로고침해 주세요.</div>'; return;
  }
  renderMine(); renderList();
})();
</script>
</body>
</html>
