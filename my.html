<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 발표 준비</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="pres.css?v=8">
</head>
<body>
<div class="wrap">
  <div class="header"><h1>📝 내 발표 준비</h1><p id="who"></p></div>
  <div id="nav" class="nav"></div>
  <div id="content"><div class="loading-state">불러오는 중...</div></div>
</div>
<div id="toastBox"></div>

<script src="session.js?v=4"></script>
<script>
const me = requireLogin();
if (me && me.isTeacher) { alert('교사 계정은 전체 현황에서 볼 수 있어요.'); location.href = 'board.html'; }

// 말하기 속도 기준: 공백 포함 약 300자/분 (3분 ≈ 900자). 적정 범위 700~1,050자
const CPM = 300, MIN_OK = 700, MAX_OK = 1050;
let base = '', pick = null, saved = null, dirty = false;
const FIELDS = ['reason', 'script', 'sources', 'aiAsked', 'aiPart', 'canva'];

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastBox').appendChild(el); setTimeout(() => el.remove(), 2400);
}
const $ = id => document.getElementById(id);
function fmtTime(chars) { const sec = Math.round(chars / CPM * 60); return Math.floor(sec / 60) + '분 ' + String(sec % 60).padStart(2, '0') + '초'; }

function readForm() {
  const o = {};
  FIELDS.forEach(f => { o[f] = $(f).value; });
  o.canva = o.canva.trim();
  const r = document.querySelector('input[name=ai]:checked');
  o.aiUsed = r ? r.value : '';
  return o;
}
function normSaved() {
  const s = saved || {}, o = {};
  FIELDS.forEach(f => { o[f] = s[f] || ''; });
  o.aiUsed = s.aiUsed || '';
  return o;
}
function sourcesDone(o) {
  if (!o.sources.trim() || !o.aiUsed) return false;
  return o.aiUsed === 'no' || (o.aiAsked.trim() && o.aiPart.trim());
}

function refresh() {
  const o = readForm();
  const v = o.script, n = v.length, n2 = v.replace(/\s/g, '').length;
  let cls = 'short', label = '조금 짧아요';
  if (n >= MIN_OK && n <= MAX_OK) { cls = 'ok'; label = '3분 발표에 적당해요 👍'; }
  else if (n > MAX_OK) { cls = 'long'; label = '조금 길어요'; }
  if (n === 0) label = '대본을 써 보세요';
  $('counter').innerHTML =
    `<span><b>${n.toLocaleString()}</b>자 <span style="color:var(--text-muted);font-size:.76rem">(공백 제외 ${n2.toLocaleString()}자)</span></span>` +
    `<span>예상 발표 시간 약 <b style="font-size:.95rem">${fmtTime(n)}</b></span><span class="st ${cls}">${label}</span>`;
  $('aiBox').style.display = o.aiUsed === 'yes' ? 'block' : 'none';
  const item = (ok, t) => `<div>${ok ? '<span class="ok">✔</span>' : '<span class="no">○</span>'} ${t}</div>`;
  $('check').innerHTML = item(o.reason.trim(), '주제 선정 이유 <span class="wh">(1점)</span>') +
    item(v.trim(), '발표 대본 <span class="wh">(2점)</span>') +
    item(sourcesDone(o), '자료 출처 <span class="wh">(2점)</span>') +
    item(o.canva, '캔바 링크 <span class="wh">(발표 자료)</span>');
  dirty = JSON.stringify(o) !== JSON.stringify(normSaved());
  $('dirtyNote').textContent = dirty ? '✏️ 저장하지 않은 내용이 있어요' : '';
}

function renderSaved() {
  const el = $('savedBox');
  if (!saved) { el.style.display = 'none'; return; }
  const d = new Date(saved.updatedAt);
  const ts = `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  const s = normSaved();
  el.style.display = 'block';
  el.innerHTML = `💾 <b>서버에 저장된 내용</b> (${ts})<br>
    · 선정 이유 ${s.reason.trim() ? '✔' : '— 아직 없음'}<br>
    · 대본 ${s.script.length.toLocaleString()}자 ${s.script ? '✔' : '— 아직 없음'}<br>
    · 자료 출처 ${s.sources.trim() ? '✔' : '— 아직 없음'} / AI ${s.aiUsed === 'yes' ? '사용함' : s.aiUsed === 'no' ? '사용 안 함' : '— 선택 안 함'}<br>
    · 캔바 ${s.canva ? '✔ <a href="' + esc(s.canva) + '" target="_blank" rel="noopener">' + esc(s.canva) + '</a>' : '— 아직 없음'}`;
}

window.save = async function () {
  const o = readForm();
  const err = $('err'); err.classList.remove('show');
  if (o.canva) {
    if (!/^https?:\/\//i.test(o.canva)) o.canva = 'https://' + o.canva;
    if (!/canva\.com|canva\.link/i.test(o.canva) && !confirm('캔바 링크가 아닌 것 같아요. 그래도 저장할까요?')) return;
  }
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '저장 중...';
  const rec = Object.assign({}, o, { updatedAt: Date.now() });
  try {
    await dbPut(base + '/scripts/' + me.id, rec);
    await dbPut(base + '/status/' + me.id, { s: o.script.length, c: !!o.canva, r: !!o.reason.trim(), o: !!sourcesDone(o), t: rec.updatedAt });
    saved = rec; $('canva').value = o.canva;
    renderSaved(); refresh();
    toast('✅ 저장했어요!');
  } catch (e) { err.textContent = e.message; err.classList.add('show'); }
  finally { btn.disabled = false; btn.textContent = '💾 저장하기'; }
};

function render() {
  const el = $('content');
  const topicCard = pick ? `
    <div class="card topic-card mine" style="padding:16px">
      <div class="tc-top"><span class="tag ${pick.unit === '별과 우주' ? 'a' : 'b'}">${esc(pick.unit)}</span>
        ${pick.kind === 'custom' ? '<span class="tag" style="background:#f3e8ff;color:#7b2cbf">직접 작성</span>' : ''}</div>
      <div class="chips">${String(pick.kw).split(',').map(k => '<span class="chip">' + esc(k.trim()) + '</span>').join('')}</div>
      <div class="tc-topic">${esc(pick.topic)}</div>
      <div id="dupNote"></div>
      <a href="pick.html" style="font-size:.76rem;color:var(--text-muted)">주제 바꾸기</a>
    </div>` : `
    <div class="card" style="border:2px dashed #ffc078;background:#fff9f0">
      <h2>아직 발표 주제를 고르지 않았어요</h2>
      <p class="hint" style="margin-bottom:10px">주제를 고르면 이 화면 맨 위에 표시돼요. 작성란은 먼저 써 두어도 괜찮아요.</p>
      <a class="btn small" style="display:inline-block;text-decoration:none" href="pick.html">📌 주제 고르러 가기</a>
    </div>`;
  el.innerHTML = topicCard + `

    <div class="checklist2"><b>📌 발표 준비하기 체크</b> <span class="wh">(채점은 선생님이 해요 · <a href="rubric.html" style="color:var(--accent)">평가기준 보기</a>)</span><div id="check"></div></div>

    <div class="card step-card">
      <h2>① 주제 선정 이유 <span class="pt-tag">1점</span></h2>
      <p class="hint">이 주제를 왜 골랐는지 간단히 써 주세요. (1~2문장)</p>
      <textarea id="reason" style="min-height:170px;line-height:1.6" maxlength="400" placeholder="【작성 요령】 ‘나의 경험이나 궁금증 + 이 주제로 알리고 싶은 점’을 1~2문장으로 써요.&#10;&#10;【예시】 밤하늘을 볼 때마다 별빛이 얼마나 오래전에 출발했는지 궁금했기 때문이다. 친구들에게도 별빛이 과거의 빛이라는 사실을 알려 주고 싶다."></textarea>
    </div>

    <div class="card step-card">
      <h2>② 발표 대본 <span class="pt-tag">2점</span></h2>
      <p class="hint">내 주제에 대해 발표할 내용을 써 보세요. 쓰는 중에는 자동 저장되지 않으니 꼭 <b>저장하기</b>를 눌러 주세요.</p>
      <textarea id="script" style="min-height:260px;line-height:1.7" placeholder="안녕하세요, 저는 ○○○입니다. 오늘 제가 소개할 주제는..."></textarea>
      <div class="counter" id="counter"></div>
      <div class="small-note">💡 3분 발표는 공백 포함 약 700~1,000자 정도가 적당해요. (1분에 300자 안팎으로 말하는 속도 기준이며, 슬라이드를 보며 설명하는 시간을 생각하면 조금 짧아도 괜찮아요. 발표 시간은 2분 30초~4분 사이가 되도록 해요.)</div>
    </div>

    <div class="card step-card">
      <h2>③ 자료 출처 <span class="pt-tag">2점</span></h2>
      <p class="hint">발표를 준비할 때 참고한 자료의 출처를 적어 주세요. (책 제목, 사이트 이름·주소, 영상 제목 등)</p>
      <textarea id="sources" style="min-height:260px;line-height:1.6" maxlength="1500" placeholder="【작성 요령】&#10;자료 하나당 한 줄씩, ‘종류 – 제목(또는 사이트 이름) – 주소·저자’ 순서로 적어요. 사진·그림을 가져왔다면 그 출처도 함께 적어요.&#10;&#10;【예시】&#10;책 – 중3 과학 교과서 ‘별과 우주’ 단원 (○○출판사)&#10;웹사이트 – NASA 블랙홀 소개 (https://science.nasa.gov/...)&#10;영상 – 유튜브 ‘블랙홀은 어떻게 생길까?’ (채널명)&#10;사진 – 허블 우주망원경 은하 사진 (NASA, https://...)"></textarea>
      <label class="field-label" style="margin-top:14px">발표를 준비하면서 AI를 활용했나요?</label>
      <div class="dc-choices">
        <label class="dc-choice"><input type="radio" name="ai" value="no"> 사용하지 않았어요</label>
        <label class="dc-choice"><input type="radio" name="ai" value="yes"> 사용했어요</label>
      </div>
      <div id="aiBox" style="display:none">
        <label class="field-label" for="aiAsked">AI에게 물어본 내용</label>
        <textarea id="aiAsked" style="min-height:90px" maxlength="1500" placeholder="예) 블랙홀을 중학생에게 설명하려면 어떤 비유가 좋을까?"></textarea>
        <label class="field-label" for="aiPart">AI의 답변 중 발표에 활용한 것</label>
        <textarea id="aiPart" style="min-height:90px" maxlength="1500" placeholder="예) ‘고무막 위에 쇠구슬’ 비유를 활용했고, 정확한지 교과서로 다시 확인했다."></textarea>
        <div class="small-note">AI의 답에는 틀린 내용이 있을 수 있어요. 활용한 부분은 꼭 다른 자료로 확인한 뒤, 내 말로 바꿔서 써 주세요.</div>
      </div>
    </div>

    <div class="card">
      <h2>🎨 캔바 링크 <span class="wh">(발표 자료)</span></h2>
      <p class="hint">캔바에서 [공유] → [링크 복사]를 하고, 링크 권한을 <b>“링크가 있는 모든 사용자(보기 가능)”</b>로 설정한 뒤 붙여넣어 주세요.<br>발표 자료는 글씨가 잘 보이는지(가독성·시인성), 사진과 정보가 보기 좋게 배치됐는지도 확인해 보세요.</p>
      <input type="text" id="canva" placeholder="https://www.canva.com/design/...">
    </div>

    <div class="error-msg" id="err"></div>
    <div id="dirtyNote" style="font-size:.78rem;color:#e8590c;text-align:center;min-height:1.2em"></div>
    <button class="btn" id="saveBtn" style="margin-top:4px" onclick="save()">💾 저장하기</button>
    <div class="savebox" id="savedBox" style="display:none"></div>`;
  const s = normSaved();
  FIELDS.forEach(f => { $(f).value = s[f]; $(f).addEventListener('input', refresh); });
  document.querySelectorAll('input[name=ai]').forEach(r => { r.checked = r.value === s.aiUsed; r.addEventListener('change', refresh); });
  renderSaved(); refresh();
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  $('who').textContent = whoLabel(me);
  renderNav('my');
  try {
    base = await basePath();
    const [p, s, all] = await Promise.all([dbGet(base + '/picks/' + me.id), dbGet(base + '/scripts/' + me.id), dbGet(base + '/picks')]);
    pick = p; saved = s;
    render();
    if (pick && pick.no) {
      const dups = Object.values(all || {}).filter(o => o && o.id !== me.id && String(o.grade) === String(me.grade) && String(o.ban) === String(me.ban) && o.no === pick.no);
      if (dups.length) $('dupNote').innerHTML =
        `<div class="dup">⚠️ 같은 반 <b>${dups.map(d => esc(d.name)).join(', ')}</b> 학생도 이 주제를 골랐어요. <b>월요일 가위바위보</b> 결과에 따라 주제가 바뀔 수 있어요. (써 둔 내용은 그대로 남아요)</div>`;
    }
  } catch (e) {
    $('content').innerHTML = '<div class="empty-state">불러오지 못했어요. 새로고침해 주세요.</div>';
  }
})();
</script>
</body>
</html>
